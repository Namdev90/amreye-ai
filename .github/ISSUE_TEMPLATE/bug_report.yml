name: Bug report
description: Report a reproducible problem in the website or Android preview.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not post credentials or patient/laboratory identifiers. Report security vulnerabilities privately using the Security tab."
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Website
        - Android online view
        - Android offline bundle
        - Documents or research references
        - Build or tests
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: App version or commit, OS/device, and browser where relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe screenshots or error details
      description: Remove sensitive data before attaching evidence.
