<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AMREye · Offline overview</title><style>body{font:17px/1.7 system-ui;background:#0b1013;color:#e8eeee;max-width:850px;margin:40px auto;padding:24px}input{width:90%;padding:16px;background:#182328;color:inherit;border:1px solid #698787;border-radius:8px}a{color:#a5e0d4}article{border-top:1px solid #456;padding:24px 0}small{color:#95cfc5}</style><h1>AMREye public overview</h1><p>Prototype project. Synthetic demonstrations. Protected technical review requires an online admin session.</p><p><a href="/">Open the website</a></p><label>Search topics <input id="q" type="search"></label><p id="state" role="status">Loading public topics…</p><main id="topics"></main><script>let topics=[];const draw=()=>{const q=document.querySelector('#q').value.toLowerCase();const list=topics.filter(t=>JSON.stringify(t).toLowerCase().includes(q));document.querySelector('#state').textContent=list.length+' topics';const box=document.querySelector('#topics');box.replaceChildren();for(const t of list){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),s=document.createElement('small'),link=document.createElement('a');h.textContent=t.title;p.textContent=t.text[0];s.textContent=t.category+' · '+t.status;link.href='/?topic='+encodeURIComponent(t.id)+'#apex';link.textContent='Open connected topic online';a.append(s,h,p,link);box.append(a)}};fetch('/repository.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{topics=d.topics;draw()}).catch(()=>document.querySelector('#state').textContent='Public reading is not available yet. Open this page once while online.');document.querySelector('#q').addEventListener('input',draw);</script></html>
